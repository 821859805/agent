# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY:sk-44252f872bf94b668d603d3cce43c13b}
openai.model=qwen3-max
openai.temperature=0.7
openai.max-tokens=2000

# Agent Configuration
agent.max-steps=20
agent.auto-compact-enabled=true
agent.auto-compact-threshold=0.92
agent.auto-compact-keep-recent=10

# Logging
logging.level.com.chatbi.agent=DEBUG
logging.level.root=INFO

server.port=8003
server.servlet.context-path=/

## ------------------------
## Spring Application
## ------------------------
spring.application.name=agent

spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/chatbi_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver