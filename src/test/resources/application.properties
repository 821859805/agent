

# Logging
logging.level.com.chatbi.agent=DEBUG
logging.level.root=INFO

server.port=8003
server.servlet.context-path=/

## ------------------------
## Spring Application
## ------------------------
spring.application.name=agent

spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/chatbi_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver